[package]
name = "lightamer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A5: 16-bit PNG decode for `cmp` (pure Rust, no system libs).
png = "0.18"
# A6: Apple capability table. Default-on; `--no-default-features` builds a
# binary with zero Apple linkage (see Scripts/rust-apple-boundary.sh).
lightamer-apple = { path = "../../crates/lightamer-apple", optional = true }
# A7a: engine registry for `commands` + `run`; serde_json for the JSONL calls.
lightamer-engine = { path = "../../crates/lightamer-engine" }
# B13'-b2: `bench` plants and times sessions directly (the CLI is exempt
# from the layer check; this is a developer tool, not an import command).
lightamer-catalog = { path = "../../crates/lightamer-catalog" }
serde_json = "1"

[features]
default = ["apple"]
apple = ["dep:lightamer-apple"]

[lints]
workspace = true
