[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

# A2 lint 起点（理由见 A2-REPORT）：unsafe 拒绝（B2 的 FFI 在 dt-decode 里
# 加局部 allow 并写理由）；pub 项文档 warn；clippy pedantic warn。
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = "warn"

# A2 profile 起点：dev 用默认（增量最快）；release 开优化 + thin LTO +
# 去符号（UI 二进制 80MB 门的起点配置，perf 波再调）。
[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
