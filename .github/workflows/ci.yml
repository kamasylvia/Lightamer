name: CI

# Unsigned distribution (2026-09-27 ruling): everything here builds with
# an ad-hoc identity and hardened runtime off — no certificates, no
# secrets. The macOS 27 deployment floor requires the macOS 27 SDK, so
# the job pins the macos-27 runner image (Xcode 27 preinstalled).
#
# push/PR  -> build + unit tests
# tag v*   -> same, plus DMG/zip artifacts and a DRAFT GitHub release
#             (a human publishes it)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  TUIST_VERSION: 4.208.0

jobs:
  build-and-test:
    # macos-27 image: public preview, Xcode 27.x preinstalled
    runs-on: macos-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Tuist (${{ env.TUIST_VERSION }})
        run: |
          curl -Ls https://tuist.dev | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tuist version

      - name: Toolchain check
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'macosx' || true
          xcrun --find metal || true

      - name: Tuist install + generate
        run: |
          tuist install
          tuist generate

      - name: Build for testing (Debug, ad-hoc)
        run: |
          set -o pipefail
          caffeinate -dis xcodebuild build-for-testing \
            -workspace Lightamer.xcworkspace -scheme Lightamer \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=NO \
            | tail -40

      - name: Unit tests (direct-launch host)
        run: Scripts/test-direct.sh

      - name: Release build (unsigned distribution shape)
        if: github.ref_type != 'tag'
        run: |
          set -o pipefail
          caffeinate -dis xcodebuild build \
            -workspace Lightamer.xcworkspace -scheme Lightamer \
            -configuration Release -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=NO \
            | tail -20

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Tuist (${{ env.TUIST_VERSION }})
        run: |
          curl -Ls https://tuist.dev | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tuist install + generate
        run: |
          tuist install
          tuist generate

      - name: Build DMG + zip artifacts
        run: Scripts/release/make-dmg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            build/release/Lightamer-*.dmg
            build/release/Lightamer-*.zip
            build/release/SHA256SUMS.txt

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            build/release/Lightamer-*.dmg
            build/release/Lightamer-*.zip
            build/release/SHA256SUMS.txt
          body: |
            Unsigned build — after downloading, right-click the app and
            choose Open the first time (Gatekeeper).
