[package]
name = "lightamer-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[dev-dependencies]
# Same rusqlite line as above (no new lock packages): integration tests open
# databases directly to assert migration/backup contents.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }

[lints]
workspace = true
