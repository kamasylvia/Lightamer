[package]
name = "dt-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# A6: Apple bindings live ONLY here (target table); [dependencies] stays
# empty so non-macOS builds pull zero third-party crates. Versions pin the
# SPIKE-RUST-APPLE lockfile exactly (see docs/APPLE-BOUNDARY.md).
# A7b adds the two view/input bindings (same 0.3.2 line as the rest).
objc2 = "=0.6.5"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-image = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-image-io = "=0.3.2"
objc2-metal = "=0.3.2"
objc2-quartz-core = "=0.3.2"
objc2-vision = "=0.3.2"
