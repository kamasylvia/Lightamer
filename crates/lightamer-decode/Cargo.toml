[package]
name = "lightamer-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# B2-a: rawspeed is built from the pinned submodule by build.rs (cmake) and
# the C shim is compiled by cc. Both crates are MIT OR Apache-2.0 (allowed
# list); cc 1.11.3 was already in Cargo.lock (B12 rusqlite), cmake is new
# (see docs/LICENSE-AUDIT.md §B2-a).
[build-dependencies]
cmake = "0.1"
cc = "1"

[dependencies]
# B2-b: pure-Rust raster + EXIF. Every license below is on
# Scripts/licenses-allow.txt (see docs/LICENSE-AUDIT.md §B2-b):
# kamadak-exif/mutate_once are BSD-2-Clause; png/tiff are MIT OR
# Apache-2.0 / MIT; zune-jpeg is MIT OR Apache-2.0 OR Zlib.
# png/tiff/zune-jpeg reuse the locked versions pulled by `image`
# (lightamer-gpui); only kamadak-exif (+mutate_once) is new.
exif = { package = "kamadak-exif", version = "0.6" }
png = "0.18"
tiff = "0.11"
zune-jpeg = "0.5"
# B3-0b: the pipe-input entry speaks the L0 vocabulary (`ImageInfo` /
# `RawFacts` from iop-traits, `Frame` from raster). Workspace-internal
# edges only; no new packages.
lightamer-iop-traits = { path = "../lightamer-iop-traits" }
lightamer-raster = { path = "../lightamer-raster" }

[dev-dependencies]
# Test-only synthesis. jpeg-encoder's license is the pre-registered
# `(MIT OR Apache-2.0) AND IJG` allow-list line (audit §5); flate2 is
# already locked (for PNG iCCP chunks in tests).
jpeg-encoder = "0.7"
flate2 = "1"
# Integration tests reuse the same locked encoders for fixture synthesis.
png = "0.18"
tiff = "0.11"

[lints]
workspace = true
