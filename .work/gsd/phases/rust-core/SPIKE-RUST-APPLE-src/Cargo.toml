[workspace]
members = [".", "bridge"]
resolver = "2"

[package]
name = "lightamer-rust-spike"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
cc = "1"

[dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3" }
objc2-core-foundation = { version = "0.3" }
objc2-core-graphics = { version = "0.3" }
objc2-metal = { version = "0.3" }
objc2-core-image = { version = "0.3" }
objc2-image-io = { version = "0.3" }
objc2-vision = { version = "0.3" }
block2 = "0.6"
libc = "0.2"

[[bin]]
name = "s4-metal"
path = "src/s4/main.rs"

[[bin]]
name = "s1-ciraw"
path = "src/s1/main.rs"

[[bin]]
name = "s1r-rawspeed"
path = "src/s1r/main.rs"

[[bin]]
name = "s3-imageio"
path = "src/s3/main.rs"

[[bin]]
name = "s2-vision"
path = "src/s2/main.rs"
