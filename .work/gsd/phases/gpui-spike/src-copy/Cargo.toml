[package]
name = "lightamer_gpui_proto"
version = "0.1.0"
edition = "2024"

[features]
# 打开时 gpui-kit 走 gpui-fast 0.1.19 后端；不打开保持默认 gpui-pre 0.3.14。
fast-backend = ["gpui-kit/gpui-fast"]

[dependencies]
gpui-kit = "0.11.0"
image = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString"] }
objc2-core-video = { version = "0.3.2", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVReturn", "CVPixelBuffer", "CVPixelBufferIOSurface"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
