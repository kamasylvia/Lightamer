[package]
name = "gpui-viewport-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
core-graphics-types = "0.1.3"
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
metal = "0.29"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["std", "NSView", "NSWindow", "NSScreen", "NSResponder", "NSApplication"] }
objc2-core-foundation = { version = "0.3.2", features = ["std", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3.2", features = ["std", "NSGeometry", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["std", "CALayer", "CAMetalLayer", "objc2-metal"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
