# active_windows = [["09:00", "14:00"], ["18:00", "23:00"]]
[[matrix.review.slot]]
orchestrator = ["zcode"]
roster = ["subagent"]  # ← 跨夜验收 = 串行单 subagent(和全天各 plan 验收同款;--review 多路模式不在本工作流使用)
# active_windows = [["23:00", "09:00"]]
# [[matrix.review.slot]]
# orchestrator = ["zcode"]
# roster = []  # ← vibe slot4:午休休眠,zcode review 静默跳过
# active_windows = [["14:00", "18:00"]]

[gsd]
# 流水线开关（2026-09-24 用户指令；消费方 = 保活巡检/orchestrator/subagent worker，每任务边界与派发前必读）
auto = true      # 自动流转：worker 完成后自动接下一波（false = 每波完成后停等用户「继续」）
paused = true  # 手动暂停：true = 全链路停（等同旧 .work/PAUSE 文件，随时可切；恢复 = 改回 false）——末次状态变更：2026-09-27 用户项目重定义（Alcedo V1），重规划期间全链路停，恢复待新 ROADMAP 签核
